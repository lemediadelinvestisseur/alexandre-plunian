# Reconstruit le site chaque matin pour que la page Publications et le flux RSS
# intègrent les nouveaux articles et vidéos. Nécessite le secret NETLIFY_BUILD_HOOK
# (Netlify → Site configuration → Build & deploy → Build hooks).
name: Reconstruction quotidienne
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le build Netlify
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Secret NETLIFY_BUILD_HOOK absent : rien à faire."; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK"
